function attendance(subject, classes) {
  const rows=classes.filter(c=>c.subject===subject.id);
  const present=Number(subject.attended||0)+rows.filter(c=>c.status==='present').length;
  const total=Number(subject.total||0)+rows.filter(c=>['present','absent'].includes(c.status)).length;
  const target=Number(subject.target||75)/100;
  const pct=total ? present/total*100 : null;
  const needed=target===1 ? (present<total?Infinity:0) : Math.max(0,Math.ceil((target*total-present-1e-9)/(1-target)));

function marksSummary(subject, assessments) {

  const earned=graded.reduce((n,a)=>n+Number(a.scored)/Number(a.maximum)*Number(a.weight),0);
  const gradedWeight=graded.reduce((n,a)=>n+Number(a.weight),0);

function parseDate(value,order='DMY') {
  const s=String(value??'').trim();
  if (/^\d{5}(\.\d+)?$/.test(s)) {const n=Number(s);if(n>20000&&n<90000)return new Date(Date.UTC(1899,11,30)+Math.floor(n)*86400000).toISOString().slice(0,10);}

function parseAmount(value) {
  let s=String(value??'').trim();
  if(!s||s==='-'||s==='—')return 0;

  s=s.replace(/INR|Rs\.?|₹|\bCR\b|\bDR\b/gi,'').replace(/[,\s()]/g,'');

  return Math.round((negative?-Math.abs(Number(s)):Number(s))*100)/100;

function categorize(description) {
  const d=description.toLowerCase();
  if(/mess|canteen|cafe|coffee|food|swiggy|zomato|restaurant|dhaba/.test(d))return 'Food & mess';
  if(/grocery|groceries|blinkit|zepto|vegetable|bigbasket/.test(d))return 'Groceries';
  if(/bus|train|irctc|uber|ola\b|taxi|travel|fuel|petrol/.test(d))return 'Travel';
  if(/book|stationery|print|course|udemy|coursera/.test(d))return 'Study';
  if(/netflix|spotify|subscription|recharge|jio|airtel/.test(d))return 'Subscriptions';
  if(/pharmacy|medical|hospital|doctor/.test(d))return 'Health';
  if(/atm|cash withdrawal/.test(d))return 'Cash withdrawal';
  if(/amazon|flipkart|myntra|shopping/.test(d))return 'Shopping';

function guessMapping(headers) {

function importRows(table,mapping,existing=[]) {
  const rows=[],issues=[],counts=new Map();
  const known=new Set(existing.map(t=>t.fingerprint).filter(Boolean));
  table.rows.forEach((row,index)=>{
    const get=k=>mapping[k]>=0?String(row[Number(mapping[k])]??'').trim():'';
    const date=parseDate(get('date'),mapping.order),description=get('description');
    if(!date){issues.push({row:index+2,reason:'Missing or invalid date'});return;}
    let amount,kind;
    if(mapping.mode==='columns') {
      const debit=parseAmount(get('debit')),credit=parseAmount(get('credit'));
      if(!Number.isFinite(debit)||!Number.isFinite(credit)||debit<0||credit<0||(debit>0&&credit>0)){issues.push({row:index+2,reason:'Ambiguous debit/credit amounts'});return;}

    } else {
      const signed=parseAmount(get('amount'));
      if(!Number.isFinite(signed)){issues.push({row:index+2,reason:'Invalid amount'});return;}
      amount=Math.abs(signed);
      if(mapping.mode==='direction'){
        const dir=get('direction').toLowerCase();

        else if(/^(cr|c|credit|deposit|income)$/.test(dir))kind='income';

function validateState(s) {

    if(!Array.isArray(s[key])||s[key].length>50000)throw new Error('Invalid backup collection: '+key);
    const ids=new Set();
    for(const row of s[key]){if(!row||typeof row.id!=='string'||!row.id||ids.has(row.id))throw new Error('Invalid record in '+key);ids.add(row.id);}
  }

}

function icsEscape(s){return String(s??'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');}
function calendarICS(state){

function readCSV(text){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell='';}else cell+=c;}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);if(quoted)throw new Error('CSV has an unclosed quotation mark. Export it again from your bank.');return rows;}

  if(!rows.length||score(rows[h])<2)throw new Error('Use a comma-separated CSV with headers such as Date, Description, Debit and Credit.');
  return {headers:rows[h],rows:rows.slice(h+1),format:'CSV',notice:'Processed in this browser. Check the date, debit and credit mapping before importing.'};
 }
 throw new Error('This feature needs the optional laptop server.');
}

ed).toFixed(1)}% of assessment weight still unconfigured.)`:''}</div><div class="table-wrap"><table><thead><tr><th>Assessment</th><th>Date</th><th>Marks</th><th>Weight</th><th>Contribution</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>${rows.map(a=>`<tr><td><strong>${esc(a.title)}</strong></td><td>${a.date?prettyDate(a.date):'—'}</td><td>${a.scored===null?badge('Pending'):a.scored+' / '+a.maximum}</td><td>${a.weight}%</td><td>${a.scored===null?'—':(a.scored/a.maximum*a.weight).toFixed(1)}</td><td>${iconBtn('Edit assessment','edit-assessment','edit',`data-id="${esc(a.id)}"`)}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">Add quizzes, assignments, mid-semester and end-semester assessments.</td></tr>'}</tbody></table></div></section>`;}).join('')||empty('Build your semester','Add a subject, then its assessment weights and marks.','add-subject','Add a subject')}`;}

function tasksPage(){const rows=state.tasks.filter(t=>(tasksAll||t.week===taskWeek)&&(!subjectFilter||t.subject===subjectFilter));return heading('MAKE SPACE FOR PROGRESS','My weekly tasks','Assignments, revision, labs and personal goals in one place.',btn('Add task','add-task','plus','primary'))+`<div class="toolbar wrap"><div class="week-picker">${iconBtn('Previous week','prev-week','left')}<strong>${prettyDate(taskWeek)} – ${prettyDate(addDays(taskWeek,6))}</strong>${iconBtn('Next week','next-week','chevron')}${btn('This week','this-week','','text-btn')}</div><label class="inline-label">${subjectSelect('subject-filter',subjectFilter,true)}</label><label class="check-label"><input type="checkbox" id="all-tasks" ${tasksAll?'checked':''}>Show all weeks</label></div><div class="week-strip">${Array.from({length:7},(_,i)=>{const d=addDays(taskWeek,i),n=state.tasks.filter(t=>t.due===d&&t.status!=='done'&&(!subjectFilter||t.subject===subjectFilter)).length;return `<div class="week-day ${d===localDate()?'today':''}"><span>${prettyDate(d,{weekday:'short'})}</span><strong>${Number(d.slice(8))}</strong><small>${n?n+' due':'All clear'}</small></div>`;}).join('')}</div><div class="kanban">${[['todo','To do','#839674'],['doing','In progress','#a281ba'],['done','Completed','#c4b06c']].map(([status,label,color])=>`<section class="kanban-column"><h2><i style="background:${color}"></i>${label}<span>${rows.filter(t=>t.status===status).length}</span></h2>${rows.filter(t=>t.status===status).sort((a,b)=>a.due.localeCompare(b.due)).map(taskCard).join('')||'<div class="kanban-empty">'+(status==='done'?'Your wins go here.':'Room for your next step.')+'</div>'}${btn('Add task','add-task','plus','add-card',`data-status="${status}"`)}</section>`).join('')}</div>`;}

function linkForm(id){const l=state.links.find(x=>x.id===id)||{title:'',description:'',url:'https://'};openModal(id?'Edit resource':'Add a useful link',`<form id="record-form" data-kind="link" data-id="${esc(id||'')}" class="stack-form">${field('Title','title',l.title,'text','required maxlength="100"')}${field('Description','description',l.description,'text','maxlength="160"')}${field('URL','url',l.url,'url','required maxlength="2000"')}${formActions('link',id)}</form>`);}
const collections={subject:'subjects',class:'classes',task:'tasks',assessment:'assessments',transaction:'transactions',note:'notes',link:'links'};
function saveRecord(form){const kind=form.dataset.kind,id=form.dataset.id,f=new FormData(form),row=Object.fromEntries(f.entries());delete row.days;delete row.until;row.id=id||uid();const numeric={subject:['credits','target','attended','total','goal'],class:['duration','reminder'],assessment:['maximum','weight'],transaction:['amount']}[kind]||[];numeric.forEach(k=>row[k]=Number(row[k]));if(kind==='subject'){row.gradePoint=row.gradePoint===''?null:Number(row.gradePoint);if(row.attended>row.total)throw new Error('Attended classes cannot exceed classes held.');}if(kind==='assessment'){row.scored=row.scored===''?null:Number(row.scored);if(row.scored!==null&&row.scored>row.maximum)throw new Error('Marks scored cannot exceed maximum marks.');}if(kind==='task')row.week=weekStart(row.week);if(kind==='note')row.updated=localDate();if(kind==='link'&&!/^https?:\/\//i.test(row.url))throw new Error('Use an http:// or https:// web address.');if(kind==='class'&&row.date>localDate()&&['present','absent'].includes(row.status))throw new Error('Future classes must be unmarked or cancelled.');
  let added=1;
  if(kind==='class'&&!id){const days=f.getAll('days').map(Number),until=f.get('until');if(days.length&&(!until||until<row.date||until>addDays(row.date,370)))throw new Error('Choose an end date within 370 days of the first date.');const dates=days.length?Array.from({length:Math.floor((new Date(until+'T12:00')-new Date(row.date+'T12:00'))/86400000)+1},(_,i)=>addDays(row.date,i)).filter(d=>days.includes(new Date(d+'T12:00').getDay())):[row.date];if(!dates.length)throw new Error('No selected weekdays fall in this date range.');added=0;const ok=change(()=>{for(const d of dates){if(state.classes.some(c=>c.subject===row.subject&&c.date===d&&c.time===row.time))continue;state.classes.push({...row,id:uid(),date:d,status:d>localDate()&&['present','absent'].includes(row.status)?'planned':row.status});added++;}});if(!ok)return;
  }else{const key=collections[kind];const ok=change(()=>{const old=state[key].find(x=>x.id===id);if(old)Object.assign(old,row);else state[key].push(row);});if(!ok)return;}
  $('#modal').close();toast(kind==='class'?`${added} class${added===1?'':'es'} saved.`:'Saved.');
}
function confirmDialog(title,detail,action,extra=''){openModal(title,`<p class="confirm-copy">${esc(detail)}</p><div class="form-actions">${btn('Cancel','close-modal')}${btn('Confirm','confirm-'+action,'','danger-btn',extra)}</div>`);}
function download(filename,text,type='application/json'){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}

function importDialog(){statement=null;review=null;openModal('Import a bank statement',`<div class="import-intro"><div class="upload-illustration">${icon('upload')}</div><h3>Your statement stays with you.</h3><p>Choose a CSV bank statement, check the columns and review your expenses. Export PDF or Excel statements as CSV before importing.</p><label class="upload-zone">${icon('upload')}<strong>Choose a bank statement</strong><span>CSV · Up to 12 MB</span><input id="statement-file" type="file" accept=".csv"></label><p class="form-help">Your file is processed in this browser. Review imported totals against your original statement before saving.</p><div id="import-status" role="status"></div></div>`);}
async function readStatement(file){if(!file)return;const status=$('#import-status');if(file.size>12*1024*1024){status.textContent='Choose a file smaller than 12 MB.';return;}status.textContent='Reading your statement locally…';try{const base64=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(file);});statement=await api('/api/statement','POST',{filename:file.name,content:base64});statement.filename=file.name;showMapping();}catch(e){status.textContent=e.message;status.className='notice danger';}}
function showMapping(){const mapping=guessMapping(statement.headers);if(mapping.debit<0&&mapping.credit<0)mapping.mode=mapping.direction>=0?'direction':'signed';const col=(label,name,v)=>selectField(label,name,[[-1,'Not mapped'],...statement.headers.map((h,i)=>[i,h+' (column '+(i+1)+')'])],v);openModal('Match your statement columns',`<form id="mapping-form" class="stack-form"><div class="notice">${esc(statement.notice)} ${statement.rows.length} source rows.</div><div class="form-grid">${col('Transaction date','date',mapping.date)}${col('Description / narration','description',mapping.description)}${selectField('Date order','order',[['DMY','DD/MM/YYYY (India)'],['MDY','MM/DD/YYYY']],mapping.order)}</div>${selectField('How amounts are recorded','mode',[['columns','Separate debit and credit columns'],['direction','Amount + debit/credit type column'],['signed','Signed amount (+ / −)']],mapping.mode)}<div class="form-grid mapping-columns">${col('Debit / withdrawal','debit',mapping.debit)}${col('Credit / deposit','credit',mapping.credit)}</div><div class="form-grid mapping-amount">${col('Amount','amount',mapping.amount)}${col('Type (DR/CR, debit/credit)','direction',mapping.direction)}${selectField('For signed amounts: expenses are','sign',[['negative','Negative amounts'],['positive','Positive amounts']],mapping.sign)}</div>${col('Reference / transaction ID (optional)','reference',mapping.reference)}<details open><summary>First ${Math.min(4,statement.rows.length)} source rows</summary><div class="table-wrap sample-table"><table><thead><tr>${statement.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${statement.rows.slice(0,4).map(r=>'<tr>'+r.map(c=>`<td>${esc(c)}</td>`).join('')+'</tr>').join('')}</tbody></table></div></details><div class="form-actions">${btn('Cancel','close-modal')}<button class="btn primary" type="submit">Review transactions ${icon('arrow')}</button></div></form>`,true);toggleMapping();}
function toggleMapping(){const mode=$('#mapping-form [name="mode"]')?.value;if(!mode)return;$('.mapping-columns').style.display=mode==='columns'?'':'none';$('.mapping-amount').style.display=mode==='columns'?'none':'';}
function reviewStatement(form){const m=Object.fromEntries(new FormData(form));['date','description','debit','credit','amount','direction','reference'].forEach(k=>m[k]=Number(m[k]));if(m.date<0||m.description<0)throw new Error('Map a date and description column.');if(m.mode==='columns'&&m.debit<0&&m.credit<0)throw new Error('Map at least a debit or credit column.');if(m.mode!=='columns'&&m.amount<0)throw new Error('Map the amount column.');if(m.mode==='direction'&&m.direction<0)throw new Error('Map the debit/credit type column.');const fields=['date','description',...(m.mode==='columns'?['debit','credit']:m.mode==='direction'?['amount','direction']:['amount'])];const mapped=fields.map(k=>m[k]).filter(x=>x>=0);if(new Set(mapped).size!==mapped.length)throw new Error('Each mapped field must use a different source column.');review=importRows(statement,m,state.transactions);if(!review.rows.length)throw new Error('No valid transactions found. Check your mapping or use a CSV/XLSX export.');showReview();}
function showReview(){openModal('Review before importing',`<div class="notice">${esc(statement.filename)} · ${review.rows.length} parsed · ${review.rows.filter(r=>r.duplicate).length} duplicates deselected · ${review.issues.length} rows skipped. Check dates, amounts and credit/debit types against your original statement.</div>${review.issues.length?`<details><summary>See skipped rows</summary><ul>${review.issues.slice(0,150).map(i=>`<li>Source row ${i.row}: ${esc(i.reason)}</li>`).join('')}</ul></details>`:''}<div id="review-total" class="review-total"></div><div class="table-wrap review-table"><table><thead><tr><th>Include</th><th>Date</th><th>Description</th><th>Amount (₹)</th><th>Type</th><th>Category</th></tr></thead><tbody>${review.rows.map((r,i)=>`<tr class="${r.duplicate?'duplicate':''}"><td><input type="checkbox" data-review-index="${i}" data-field="include" ${r.include?'checked':''} aria-label="Include row ${i+1}">${r.duplicate?'<small>Duplicate</small>':''}</td><td><input type="date" data-review-index="${i}" data-field="date" value="${r.date}" required aria-label="Date row ${i+1}"></td><td><input data-review-index="${i}" data-field="description" value="${esc(r.description)}" required aria-label="Description row ${i+1}"></td><td><input type="number" min="0.01" step="0.01" data-review-index="${i}" data-field="amount" value="${r.amount}" required aria-label="Amount row ${i+1}"></td><td><select data-review-index="${i}" data-field="kind" aria-label="Type row ${i+1}">${['expense','income','refund','transfer'].map(k=>`<option ${k===r.kind?'selected':''}>${k}</option>`).join('')}</select></td><td><select data-review-index="${i}" data-field="category" aria-label="Category row ${i+1}">${CATEGORIES.map(k=>`<option ${k===r.category?'selected':''}>${k}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div><label class="check-label review-confirm"><input type="checkbox" id="review-checked">I checked the rows, skipped items and totals against my statement.</label><div class="form-actions">${btn('Back to mapping','import-back')}${btn('Import selected rows','import-save','check','primary')}</div>`,true);updateReviewTotal();}
function updateReviewTotal(){const rows=review.rows.filter(r=>r.include),sum=k=>rows.filter(r=>r.kind===k).reduce((n,r)=>n+Math.round(Number(r.amount)*100),0)/100;$('#review-total').textContent=`${rows.length} selected · Spending ${money(sum('expense'))} · Income ${money(sum('income'))} · Refunds ${money(sum('refund'))} · Transfers ${money(sum('transfer'))}`;}
function saveImport(){if(!$('#review-checked').checked)throw new Error('Check the review box after comparing with your statement.');const rows=review.rows.filter(r=>r.include);if(!rows.length)throw new Error('Select at least one transaction.');const ok=change(()=>{state.transactions.push(...rows.map(({include,duplicate,sourceRow,...r})=>({...r,id:uid(),amount:Number(r.amount)})));});if(ok){$('#modal').close();month=rows[0].date.slice(0,7);nav='expenses';location.hash='expenses';render();toast(`${rows.length} transactions imported.`);}}

function timerRemaining(){return timer.running?Math.max(0,Math.ceil((timer.endAt-Date.now())/1000)):Math.max(0,timer.remaining);}
function storeTimer(){try{localStorage.setItem('mandi-timer',JSON.stringify(timer));}catch{}}
function drawTimer(){const n=timerRemaining(),el=$('#timer-display');if(el)el.textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}
function tickTimer(){if(timer.running&&timerRemaining()===0){const minutes=timer.minutes,sub=timer.subject;timer.running=false;timer.remaining=minutes*60;storeTimer();if(minutes!==5)change(()=>state.sessions.push({id:uid(),date:localDate(),minutes,subject:sub}));notify('Session complete',minutes===5?'Ready for your next focus session?':'Good work. Take a little break.');if(nav==='focus')render();}drawTimer();}
async function notify(title,body){toast(title+' · '+body);if('Notification' in window&&Notification.permission==='granted'){try{const registration=await navigator.serviceWorker?.getRegistration();if(registration)await registration.showNotification(title,{body,icon:'/icon-192.png',tag:title});else new Notification(title,{body});}catch{}}}
const remindersSeen=new Set();
function checkReminders(){if(!state)return;const now=Date.now();for(const c of state.classes){if(c.status!=='planned'||Number(c.reminder)<=0)continue;const start=new Date(c.date+'T'+c.time).getTime(),due=start-Number(c.reminder)*60000,key='c'+c.id+c.date+c.time;if(now>=due&&now<start&&!remindersSeen.has(key)){remindersSeen.add(key);notify(subject(c.subject)?.name||'Upcoming class',`${prettyTime(c.time)} · ${c.location||'Check your timetable'}`);}}for(const t of state.tasks){if(t.status==='done')continue;const due=new Date(t.due+'T'+(t.time||'18:00')).getTime(),key='t'+t.id+t.due+t.time;if(now>=due-30*60000&&now<due&&!remindersSeen.has(key)){remindersSeen.add(key);notify('Task due soon',t.title);}}}
async function devices(){openModal('Open on another device',`<div class="device-guide"><h3>Your workspace on desktop and mobile</h3><p>Open this address on your other device :</p><code class="address">${esc(location.href.split('#')[0])}</code><p>Your laptop can be switched off. Records are separate in each browser; download a backup here, then restore it in Settings on the other device.</p>${btn('Download backup','backup','download','primary')}</div>`);}
async function install(){if(installPrompt){await installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;}else openModal('Install Mandi Companion',`<div class="device-guide"><h3>Desktop / Android</h3><p>Open this website in Chrome or Edge. Use the browser menu’s Install app option when available.</p><h3>iPhone / iPad</h3><p>Open this website in Safari, then use Share → Add to Home Screen.</p><p>No local server is needed. Records stay in this browser. Browser alerts work while the app is open; export your calendar for closed-app reminders.</p></div>`);}
function remindersDialog(){const upcoming=state.classes.filter(c=>c.status==='planned'&&new Date(c.date+'T'+c.time)>new Date()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,6);openModal('Your next classes',`${upcoming.map(c=>`<div class="reminder-item"><span>${prettyDate(c.date)}</span>${classRow(c,true)}</div>`).join('')||empty('No upcoming classes','Add your class schedule to receive reminders.')}<div class="notice">In-app reminders work while this page is open. For closed-app reminders, import your exported calendar into your calendar app.</div><div class="form-actions">${btn('Enable alerts','enable-notifications','bell')}${btn('Export calendar','calendar-export','download','primary')}</div>`);}
async function restoreBackup(file){if(!file)return;try{if(file.size>16*1024*1024)throw new Error('Backup is too large.');const value=JSON.parse(await file.text()),incoming=validateState(value.state||value);window.pendingRestore=incoming;confirmDialog('Replace workspace from backup?',`This replaces the current workspace with ${incoming.subjects.length} subjects, ${incoming.tasks.length} tasks and ${incoming.transactions.length} transactions. Download a backup first if needed.`,'restore');}catch(e){toast(e.message,true);}}

document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,id=el.dataset.id;try{
  if(a==='easy-settings'){location.hash='settings';}else if(a==='menu'){mobileOpen=!mobileOpen;render();}
  else if(a==='close-modal')$('#modal').close();
  else if(a==='add-subject'||a==='edit-subject')subjectForm(id);
  else if(a==='add-class'||a==='edit-class')classForm(id);
  else if(a==='add-task'||a==='edit-task')taskForm(id,el.dataset.status);
  else if(a==='add-assessment'||a==='edit-assessment')assessmentForm(id);
  else if(a==='add-transaction'||a==='edit-transaction')transactionForm(id);
  else if(a==='add-note'||a==='edit-note')noteForm(id);
  else if(a==='add-link'||a==='edit-link')linkForm(id);
  else if(a==='mark')change(()=>state.classes.find(c=>c.id===id).status=el.dataset.value);
  else if(a==='toggle-task')change(()=>{const t=state.tasks.find(t=>t.id===id);t.status=t.status==='done'?'todo':'done';});
  else if(a==='prev-week'||a==='next-week'||a==='this-week'){taskWeek=a==='this-week'?weekStart():addDays(taskWeek,a==='prev-week'?-7:7);tasksAll=false;render();}
  else if(a==='delete-record')confirmDialog('Delete this '+el.dataset.kind+'?',el.dataset.kind==='subject'?'This also deletes its classes and assessments. Its tasks and notes become personal items.':'This record will be removed.','delete',`data-kind="${el.dataset.kind}" data-id="${esc(id)}"`);
  else if(a==='confirm-delete'){const key=collections[el.dataset.kind];change(()=>{state[key]=state[key].filter(x=>x.id!==id);if(key==='subjects'){state.classes=state.classes.filter(x=>x.subject!==id);state.assessments=state.assessments.filter(x=>x.subject!==id);[...state.tasks,...state.notes,...state.sessions].forEach(x=>{if(x.subject===id)x.subject='';});subjectFilter='';}});$('#modal').close();toast('Deleted.');}
  else if(a==='import')importDialog();
  else if(a==='import-back')showMapping();
  else if(a==='import-save')saveImport();
  else if(a==='budget')openModal('Set your monthly budget',`<form id="budget-form" class="stack-form">${field('Monthly budget (₹)','budget',state.settings.budget,'number','min="0" max="100000000" step="0.01" required')}<p class="form-help">This is your default budget for every month.</p><button class="btn primary">Save budget</button></form>`);
  else if(a==='backup')download(`mandi-backup-${localDate()}.json`,JSON.stringify({exportedAt:new Date().toISOString(),state},null,2));
  else if(a==='restore'){const input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=()=>restoreBackup(input.files[0]);input.click();}
  else if(a==='confirm-restore'){if(window.pendingRestore&&change(()=>state=window.pendingRestore)){window.pendingRestore=null;$('#modal').close();toast('Backup restored.');}}
  else if(a==='export-transactions'){const rows=state.transactions.filter(t=>t.date.startsWith(month)),cell=x=>'"'+String(x??'').replaceAll('"','""').replace(/^[=+@-]/,"'$&")+'"';download(`mandi-expenses-${month}.csv`,'Date,Description,Amount,Type,Category\r\n'+rows.map(t=>[t.date,t.description,t.amount,t.kind,t.category].map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
  else if(a==='calendar-export'){download('mandi-classes-and-tasks.ics',calendarICS(state),'text/calendar;charset=utf-8');toast('Calendar exported. Import it into your calendar app and check its reminder settings.');}
  else if(a==='clear-demo'||a==='reset'||a==='load-demo')confirmDialog(a==='load-demo'?'Load sample workspace?':'Start with a clean workspace?',a==='load-demo'?'This replaces your current records with example subjects, tasks and transactions. Download a backup first if needed.':'This removes the current records. Your profile settings and useful links stay. Download a backup first if needed.',a==='load-demo'?'demo':'reset');
  else if(a==='confirm-reset'){change(()=>{const {settings,links}=state;state=emptyState();state.settings={...settings,demo:false};state.links=links;subjectFilter='';});$('#modal').close();toast('Your workspace is ready. Start by adding your subjects.');}
  else if(a==='confirm-demo'){change(()=>state=demoState());$('#modal').close();}
  else if(a==='reload'){if(dirty){confirmDialog('Load the latest saved version?','Download your pending backup first. This discards unsynced changes on this device.','reload');}else location.reload();}
  else if(a==='confirm-reload'){dirty=false;localStorage.removeItem(cacheKey);location.reload();}
  else if(a==='reconnect'){await connect(true);}
  else if(a==='enable-notifications'){if(!('Notification'in window)||!window.isSecureContext){toast('Browser alerts need localhost or trusted HTTPS. Use calendar export on this connection.',true);}else{const p=await Notification.requestPermission();toast(p==='granted'?'Browser alerts enabled while the app is open.':'Alerts were not enabled. Calendar reminders remain available.');}}
  else if(a==='reminders')remindersDialog();
  else if(a==='devices')await devices();
  else if(a==='install')await install();
  else if(a==='timer-preset'){timer={minutes:Number(el.dataset.minutes),remaining:Number(el.dataset.minutes)*60,running:false,subject:timer.subject};storeTimer();render();}
  else if(a==='timer-toggle'){timer.subject=$('#focus-subject')?.value||timer.subject;if(timer.running){timer.remaining=timerRemaining();timer.running=false;}else{timer.endAt=Date.now()+timer.remaining*1000;timer.running=true;}storeTimer();render();}
  else if(a==='timer-reset'){timer.running=false;timer.remaining=timer.minutes*60;storeTimer();render();}
}catch(error){toast(error.message,true);}});
document.addEventListener('submit',async e=>{e.preventDefault();try{const f=e.target;if(f.id==='record-form')saveRecord(f);else if(f.id==='settings-form'){const data=Object.fromEntries(new FormData(f));data.budget=Number(data.budget);data.reminder=Number(data.reminder);if(change(()=>Object.assign(state.settings,data)))toast('Settings saved.');}else if(f.id==='budget-form'){if(change(()=>state.settings.budget=Number(new FormData(f).get('budget'))))$('#modal').close();}else if(f.id==='mapping-form')reviewStatement(f);else if(f.id==='login-form'){await api('/api/login','POST',{code:new FormData(f).get('code')});$('#modal').close();await connect(true);}}catch(error){toast(error.message,true);}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.reviewIndex!==undefined){const r=review.rows[Number(el.dataset.reviewIndex)];r[el.dataset.field]=el.type==='checkbox'?el.checked:el.type==='number'?Number(el.value):el.value;updateReviewTotal();return;}if(el.dataset.taskId){change(()=>state.tasks.find(t=>t.id===el.dataset.taskId).status=el.value);return;}if(el.id==='subject-filter'){subjectFilter=el.value;render();}else if(el.id==='class-filter'){classFilter=el.value;render();}else if(el.id==='all-tasks'){tasksAll=el.checked;render();}else if(el.id==='expense-month'){month=el.value||localDate().slice(0,7);render();}else if(el.id==='expense-kind'){expenseKind=el.value;render();}else if(el.id==='statement-file')readStatement(el.files[0]);else if(el.id==='focus-subject'){timer.subject=el.value;storeTimer();}else if(el.name==='subject'&&el.closest('[data-kind="class"]')){el.closest('form').elements.location.value=subject(el.value)?.location||'';}else if(el.closest('#mapping-form'))toggleMapping();else if(el.id.startsWith('sim-'))updateSimulator();});
document.addEventListener('input',e=>{if(e.target.id.startsWith('sim-'))updateSimulator();if(e.target.id==='transaction-search'){const pos=e.target.selectionStart;search=e.target.value;render();const input=$('#transaction-search');input.focus();input.setSelectionRange(pos,pos);}});
matchMedia('(max-width:760px)').addEventListener('change',()=>{if(state&&!$('#modal').open)render();});

let friendQuery='';
function friendList(){return Array.isArray(state.settings.friends)?state.settings.friends:[];}
function friendBirthday(value){if(!value)return '';const parts=String(value).split('-');if(parts.length!==3)return '';const now=new Date(localDate()+'T12:00'),year=now.getFullYear();let next=new Date(year,Number(parts[1])-1,Number(parts[2]),12);if(next<now)next=new Date(year+1,Number(parts[1])-1,Number(parts[2]),12);const days=Math.round((next-now)/86400000);return days===0?'Birthday today!':`Birthday in ${days} day${days===1?'':'s'}`;}
function friendCards(){const q=friendQuery.trim().toLowerCase(),rows=friendList().filter(f=>[f.name,f.course,f.hostel,f.group,f.notes].join(' ').toLowerCase().includes(q)).sort((a,b)=>Number(b.favourite)-Number(a.favourite)||a.name.localeCompare(b.name));return rows.map(f=>`<article class="panel friend-card"><div class="friend-head"><div class="avatar">${esc(f.name.slice(0,1).toUpperCase())}</div><div><h2>${esc(f.name)}</h2><p class="muted">${esc([f.course,f.group].filter(Boolean).join(' · '))}</p></div>${btn(f.favourite?'★':'☆','friend-star','','text-btn',`data-id="${esc(f.id)}" aria-label="${f.favourite?'Unfavourite':'Favourite'} ${esc(f.name)}"`)}</div>${f.hostel?`<p>Hostel / room: ${esc(f.hostel)}</p>`:''}${f.phone?`<p>Phone: ${esc(f.phone)}</p>`:''}${f.email?`<p>Email: ${esc(f.email)}</p>`:''}${f.birthday?`<p class="birthday-tag">${esc(friendBirthday(f.birthday))} · ${prettyDate(f.birthday)}</p>`:''}${f.notes?`<p class="friend-notes">${esc(f.notes)}</p>`:''}<div class="friend-actions">${btn('Edit friend','friend-edit','edit','secondary',`data-id="${esc(f.id)}"`)}${btn('Remove','friend-delete','trash','text-btn',`data-id="${esc(f.id)}"`)}</div></article>`).join('')||empty(q?'No matching friends':'Keep your campus circle close',q?'Try a different name, course, hostel or group.':'Add friends, classmates, project partners or hostel mates.','friend-add','Add a friend');}
function friendsPage(){return heading('YOUR CAMPUS CIRCLE','My friends','A private list of the people you want to keep in touch with.',btn('Add friend','friend-add','plus','primary'))+`<div class="notice">This is your personal contact list. Adding a friend does not send an invitation or share your data. Friends are included in your backup.</div><div class="toolbar"><label class="search-box">${icon('search')}<input id="friend-search" type="search" aria-label="Search friends" placeholder="Search name, course, hostel or group" value="${esc(friendQuery)}"></label><span class="muted">${friendList().length} friends · ${friendList().filter(f=>f.favourite).length} favourites</span></div><div id="friend-cards" class="friend-grid">${friendCards()}</div>`;}
function friendForm(id){const f=friendList().find(x=>x.id===id)||{name:'',phone:'',email:'',course:'',hostel:'',group:'',birthday:'',notes:''};openModal(id?'Edit friend':'Add a friend',`<form id="friend-form" data-id="${esc(id||'')}" class="stack-form">${field('Name','name',f.name,'text','required maxlength="100"')}<div class="form-grid">${field('Phone (optional)','phone',f.phone,'tel','maxlength="30"')}${field('Email (optional)','email',f.email,'email','maxlength="200"')}</div><div class="form-grid">${field('Course / branch','course',f.course,'text','maxlength="100"')}${field('Hostel / room','hostel',f.hostel,'text','maxlength="100"')}</div><div class="form-grid">${field('Group (e.g. project team)','group',f.group,'text','maxlength="80"')}${field('Birthday (optional)','birthday',f.birthday,'date')}</div><label>Notes<textarea name="notes" rows="3" maxlength="3000">${esc(f.notes)}</textarea></label><button class="btn primary" type="submit">Save friend</button></form>`);}
document.addEventListener('input',e=>{if(e.target.id==='friend-search'){friendQuery=e.target.value;$('#friend-cards').innerHTML=friendCards();}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='friend-add'||a==='friend-edit')friendForm(id);if(a==='friend-star')change(()=>{const f=friendList().find(f=>f.id===id);if(f)f.favourite=!f.favourite;});if(a==='friend-delete'){const f=friendList().find(f=>f.id===id);if(f)confirmDialog('Remove friend?',`Remove ${f.name} from your personal list? This does not contact them.`,'friend-remove',`data-id="${esc(id)}"`);}if(a==='confirm-friend-remove'){change(()=>state.settings.friends=friendList().filter(f=>f.id!==id));$('#modal').close();toast('Friend removed.');}});
document.addEventListener('submit',e=>{if(e.target.id!=='friend-form')return;e.preventDefault();const form=e.target,d=Object.fromEntries(new FormData(form));d.name=d.name.trim();if(!d.name){toast('Enter a name.',true);return;}if(change(()=>{state.settings.friends=friendList();const old=friendList().find(f=>f.id===form.dataset.id);if(old)Object.assign(old,d);else state.settings.friends.push({...d,id:uid(),favourite:false});})){ $('#modal').close();toast('Friend saved.');}});

function customHub(){const ui=state.settings.ui||{},exams=state.settings.exams||[],goals=state.settings.goals||[];return `<section class="panel custom-hub"><div class="section-title"><h2>Your personal dashboard</h2>${btn('Customise','customise','settings')}</div>${ui.quick!==false?`<div class="quick-grid">${[['Add task','add-task','tasks'],['Record marks','add-assessment','chart'],['Schedule class','add-class','calendar'],['Add expense','add-transaction','wallet'],['Add subject','add-subject','book'],['Write note','add-note','edit'],['Add friend','friend-add','sun']].map(([l,a,i])=>btn(l,a,i)).join('')}</div>`:''}<div class="custom-columns">${ui.exams!==false?`<div><div class="section-title"><h2>Exam countdown</h2>${btn('Add exam','exam-add','plus')}</div>${exams.map(x=>{const n=Math.ceil((new Date(x.date+'T12:00')-new Date(localDate()+'T12:00'))/86400000);return `<div class="goal-row"><div><strong>${esc(x.title)}</strong><p>${prettyDate(x.date)} · ${n<0?'Finished':n===0?'Today':n+' days left'}</p></div>${btn('Edit','exam-edit','','text-btn',`data-id="${esc(x.id)}"`)}</div>`;}).join('')||'<p class="muted">Add exams, lab evaluations or project reviews.</p>'}</div>`:''}${ui.goals!==false?`<div><div class="section-title"><h2>Weekly goals</h2>${btn('Add goal','goal-add','plus')}</div>${goals.filter(g=>g.week===weekStart()).map(g=>`<div class="goal-row"><label class="check-label"><input type="checkbox" data-goal="${esc(g.id)}" ${g.done?'checked':''}>${esc(g.title)}</label>${btn('Edit','goal-edit','','text-btn',`data-id="${esc(g.id)}"`)}</div>`).join('')||'<p class="muted">Choose a few goals for this week. Past goals stay in your backup.</p>'}</div>`:''}</div></section>`;}
function applyPersonalisation(){const u=state.settings.ui||{};document.body.dataset.theme=u.theme||'forest';document.body.dataset.text=u.text||'normal';document.body.dataset.density=u.density||'comfortable';}
function customise(){const u=state.settings.ui||{};openModal('Make this app yours',`<form id="personal-form" class="stack-form">${selectField('Colour theme','theme',[['forest','Forest green'],['ocean','Ocean blue'],['plum','Plum purple']],u.theme||'forest')}${selectField('Text size','text',[['normal','Normal'],['large','Large']],u.text||'normal')}${selectField('Spacing','density',[['comfortable','Comfortable'],['compact','Compact']],u.density||'comfortable')}${selectField('Start page','home',navItems.map(x=>[x[0],x[1]]),u.home||'overview')}<fieldset><legend>Dashboard sections</legend>${[['quick','Quick actions'],['exams','Exam countdown'],['goals','Weekly goals']].map(([k,l])=>`<label class="check-label"><input name="${k}" type="checkbox" ${u[k]!==false?'checked':''}>${l}</label>`).join('')}</fieldset><button class="btn primary">Save preferences</button></form>`);}
function plannerForm(kind,id){const key=kind==='exam'?'exams':'goals',x=(state.settings[key]||[]).find(x=>x.id===id)||{title:'',date:localDate(),week:weekStart(),done:false};openModal(kind==='exam'?'Exam or milestone':'Weekly goal',`<form id="extra-form" data-kind="${kind}" data-id="${esc(id||'')}" class="stack-form">${field('Title','title',x.title,'text','required maxlength="160"')}${field(kind==='exam'?'Exam date':'Week containing',kind==='exam'?'date':'week',kind==='exam'?x.date:x.week,'date','required')}<div class="form-actions">${id?btn('Remove','extra-remove','trash','danger-btn',`data-kind="${kind}" data-id="${esc(id)}"`):''}<button class="btn primary">Save</button></div></form>`);}
function commandResults(q=''){q=q.toLowerCase();const actions=[['Add a friend','friend-add'],['Add a task','add-task'],['Add a subject','add-subject'],['Schedule classes','add-class'],['Record marks','add-assessment'],['Add an expense','add-transaction'],['Import statement','import'],['Write a note','add-note'],['Download backup','backup'],['Export reminders','calendar-export'],['Customise appearance','customise']];return actions.filter(([l])=>l.toLowerCase().includes(q)).map(([l,a])=>btn(l,a,'arrow','command-result')).join('')+navItems.filter(x=>x[1].toLowerCase().includes(q)).map(([id,l])=>`<a class="command-result btn" href="#${id}" data-action="close-modal">Open ${esc(l)}</a>`).join('')+(q?state.tasks.filter(t=>t.title.toLowerCase().includes(q)).slice(0,8).map(t=>btn('Task: '+esc(t.title),'edit-task','tasks','command-result',`data-id="${esc(t.id)}"`)).join('')+state.notes.filter(t=>t.title.toLowerCase().includes(q)).slice(0,8).map(t=>btn('Note: '+esc(t.title),'edit-note','book','command-result',`data-id="${esc(t.id)}"`)).join(''):'');}
function commands(){openModal('Find anything or add something',`<label>Search actions, pages, tasks and notes<input id="command-query" placeholder="Try attendance, expense, or a task name" autocomplete="off"></label><div id="command-results">${commandResults()}</div>`);$('#command-query').focus();}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();commands();}});
document.addEventListener('input',e=>{if(e.target.id==='command-query')$('#command-results').innerHTML=commandResults(e.target.value)||'<p>No matching items.</p>';});
document.addEventListener('change',e=>{if(e.target.dataset.goal){const id=e.target.dataset.goal,checked=e.target.checked;change(()=>state.settings.goals.find(g=>g.id===id).done=checked);}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='customise')customise();if(a==='commands')commands();if(['exam-add','exam-edit','goal-add','goal-edit'].includes(a))plannerForm(a.split('-')[0],b.dataset.id);if(a==='extra-remove'){change(()=>{const k=b.dataset.kind==='exam'?'exams':'goals';state.settings[k]=state.settings[k].filter(x=>x.id!==b.dataset.id);});$('#modal').close();toast('Removed.');}});
document.addEventListener('submit',e=>{const f=e.target;if(!['personal-form','extra-form'].includes(f.id))return;e.preventDefault();const d=Object.fromEntries(new FormData(f));if(f.id==='personal-form'){for(const k of ['quick','goals','exams'])d[k]=new FormData(f).has(k);change(()=>state.settings.ui=d);}else{const k=f.dataset.kind==='exam'?'exams':'goals';if(k==='goals')d.week=weekStart(d.week);change(()=>{state.settings[k]??=[];const old=state.settings[k].find(x=>x.id===f.dataset.id);if(old)Object.assign(old,d);else state.settings[k].push({...d,id:uid(),done:false});});}$('#modal').close();toast('Saved.');});

async function connect(retry=false){try{const current=await api('/api/state');if(dirty){if(current.revision!==revision){conflict=true;connected=true;render();return;}connected=true;await flush();}else{state=current.state?validateState(current.state):emptyState();revision=current.revision;connected=true;dirty=!current.state;if(dirty)flush();cache();}render();}catch(e){if(e.status===401){login();return;}connected=false;if(!state){try{const cached=JSON.parse(localStorage.getItem(cacheKey));if(cached?.state){state=validateState(cached.state);revision=cached.revision;dirty=cached.dirty;}}catch{}}if(state)render();else{$('#app').innerHTML='<div class="boot"><h1>Browser storage unavailable</h1><p>Allow site storage in your browser settings, then try again.</p>'+btn('Try again','reconnect')+'</div>';}if(retry)toast(e.message,true);}}
try{const cached=JSON.parse(localStorage.getItem(cacheKey));if(cached?.state&&cached.dirty){state=validateState(cached.state);revision=cached.revision;dirty=true;}}catch{}
await connect();
if(state&&!location.hash&&state.settings.ui?.home){nav=state.settings.ui.home;render();}
if('serviceWorker'in navigator&&window.isSecureContext)navigator.serviceWorker.register('./sw.js').catch(()=>{});
setInterval(tickTimer,1000);setInterval(checkReminders,20000);
setInterval(async()=>{if(dirty){flush();return;}if(saving||$('#modal').open)return;try{const current=await api('/api/state');if(!current.state)return;if(current.revision!==revision){state=validateState(current.state);revision=current.revision;cache();render();}connected=true;updateConnection();}catch(e){connected=false;updateConnection();}},12000);

})();</script>
</body>
</html>
